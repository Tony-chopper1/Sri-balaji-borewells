<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Emblem Shield / Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#navyGrad)" stroke="#38bdf8" stroke-width="8" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Groundwater Depth Layers (Stratum) -->
  <path d="M 60 360 Q 250 380 440 360 L 440 430 Q 250 450 60 430 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M 90 390 Q 250 410 410 390 L 410 440 Q 250 460 90 440 Z" fill="#1e293b" opacity="0.8"/>

  <!-- Borewell Drilling Rig Derrick / Mast -->
  <!-- Left Leg -->
  <line x1="170" y1="330" x2="225" y2="120" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Leg -->
  <line x1="330" y1="330" x2="275" y2="120" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <!-- Derrick Cross Braces -->
  <line x1="185" y1="280" x2="315" y2="280" stroke="#94a3b8" stroke-width="7"/>
  <line x1="200" y1="220" x2="300" y2="220" stroke="#94a3b8" stroke-width="7"/>
  <line x1="215" y1="165" x2="285" y2="165" stroke="#94a3b8" stroke-width="7"/>
  <line x1="185" y1="280" x2="300" y2="220" stroke="#38bdf8" stroke-width="5"/>
  <line x1="315" y1="280" x2="200" y2="220" stroke="#38bdf8" stroke-width="5"/>
  <line x1="200" y1="220" x2="285" y2="165" stroke="#38bdf8" stroke-width="5"/>
  <line x1="300" y1="220" x2="215" y2="165" stroke="#38bdf8" stroke-width="5"/>
  <!-- Crown Block on Top -->
  <rect x="220" y="105" width="60" height="18" rx="4" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>

  <!-- Central Drill Pipe (Kelly & Drill Stem) -->
  <line x1="250" y1="120" x2="250" y2="350" stroke="#fbbf24" stroke-width="10" stroke-linecap="square"/>
  <line x1="247" y1="120" x2="247" y2="350" stroke="#fff" stroke-width="2"/>

  <!-- Drill Bit Teeth -->
  <polygon points="238,350 262,350 258,375 250,385 242,375" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>

  <!-- Fresh Gushing Water Drops Fountain (Sign of struck aquifer) -->
  <!-- Left jet -->
  <path d="M 235 340 C 180 320, 140 260, 155 210 C 170 160, 200 240, 235 320 Z" fill="url(#cyanGrad)" opacity="0.85"/>
  <!-- Right jet -->
  <path d="M 265 340 C 320 320, 360 260, 345 210 C 330 160, 300 240, 265 320 Z" fill="url(#cyanGrad)" opacity="0.85"/>

  <!-- Main Pure Water Droplet Overlay in Center -->
  <path d="M 250 170 C 250 170 205 235 205 270 C 205 295 225 315 250 315 C 275 315 295 295 295 270 C 295 235 250 170 250 170 Z" fill="#ffffff" fill-opacity="0.9" stroke="#38bdf8" stroke-width="6" filter="url(#glow)"/>
  <path d="M 250 185 C 250 185 218 240 218 268 C 218 286 232 302 250 302 C 268 302 282 286 282 268 C 282 240 250 185 250 185 Z" fill="url(#cyanGrad)"/>
  <circle cx="238" cy="255" r="7" fill="#ffffff" opacity="0.8"/>

  <!-- Circular Arch Text: Sri Balaji Borewells -->
  <path id="textArcTop" d="M 90 250 A 160 160 0 0 1 410 250" fill="none"/>
  <text font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      SRI BALAJI BOREWELLS
    </textPath>
  </text>

  <!-- Tagline at bottom -->
  <text x="250" y="445" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
    DRILLING &amp; WATER SOLUTIONS
  </text>
</svg>
